name: Update HUE-NOX Google Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Google product feed
        run: python feed_generator.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-feed.xml
          git diff --cached --quiet || git commit -m "Update HUE-NOX product feed"
          git push
